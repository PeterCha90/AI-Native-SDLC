# ops/bands.yaml — Stage 06(maintain) 자동 감지 기준.
#
# 이 파일은 모델이 아니라 결정론적 스크립트(ops/detect.sh)가 읽는다. "이상이 발생했는가"는
# 항상 deviation = |value - baseline| / sigma 라는 산수로 계산되며, 모델이 판단해서
# 결정하는 지점이 아니다. Claude는 tier 2 이상일 때만, 그것도 사후에 read-only 진단
# 또는 티켓 작성 역할로만 호출된다.
#
# tier별 action은 고정이다(바꾸지 말 것):
#   1sigma: log      — 기록만 한다. 에이전트 미개입.
#   2sigma: diagnose — Claude를 read-only로 띄워 원인만 진단한다. 코드/설정을 고치지 않는다.
#   3sigma: act      — 진단 결과를 새 intent.md로 쓰고 Linear에 티켓을 만든다.
#                       직접 조치는 하지 않는다 — PR 또는 사전 승인된 runbook 경유로만.
#
# baseline/sigma는 이 데모 규모(단일 프로세스, 트래픽 거의 없음)에 맞춘 초기값이다.
# 실제 운영 데이터가 쌓이면 재보정한다.

metrics:
  unit_test_failure_rate:
    description: "backend `pytest -q` 실행에서 실패한 테스트 비율"
    window: "최근 20회 pytest 실행 롤링"
    baseline: 0.0   # 정상 상태는 항상 전부 통과
    sigma: 0.05
    tiers:
      1sigma: log
      2sigma: diagnose
      3sigma: act

  e2e_failure_rate:
    description: "e2e/check.sh 실행 중 exit=1(버그 재현)로 끝난 비율. exit=2(환경 문제, ego-browser 미설치 등)는 표본에서 제외"
    window: "최근 10회 e2e/check.sh 실행 롤링"
    baseline: 0.0   # 버그가 없는 정상 운영 상태에서는 전부 통과해야 함
    sigma: 0.1
    tiers:
      1sigma: log
      2sigma: diagnose
      3sigma: act

  api_5xx_rate:
    description: "API 응답 중 5xx 상태 코드 비율 (404 not-found, 409/422 같은 정상 4xx 경로는 제외)"
    window: "최근 100건 요청 롤링"
    baseline: 0.0   # 코드에 처리 안 된 예외가 없으면 5xx는 발생하지 않음
    sigma: 0.02
    tiers:
      1sigma: log
      2sigma: diagnose
      3sigma: act
